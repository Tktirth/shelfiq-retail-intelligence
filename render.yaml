services:
  - type: web
    name: shelfiq-api
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements-render.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DEMO_MODE
        value: "true"
      - key: PYTHON_VERSION
        value: "3.11.9"
